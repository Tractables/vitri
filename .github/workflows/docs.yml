name: Docs

# Builds the crate's rustdoc and the browser page, and publishes both to GitHub
# Pages: the page at the site root, the rustdoc at the paths it always had.
#
# A push to main, which is how a pull request merges, builds the site and
# publishes it, so Pages serves the default branch. The nightly run only builds,
# and a manual run publishes when `publish` is ticked. The documentation build
# needs none of the C++ toolchain the CI job installs: the build script returns
# early when `DOCS_RS` is set, and rustdoc type-checks the crate without ever
# linking it, so the vendored Arjun stack and the FlowCutter goatd compiles are
# neither built nor needed. That is the path docs.rs itself takes, and it still
# renders the whole public surface. The page itself comes from the Web build
# workflow, run here as a job of this one.
#
# `deploy` is the only part that needs the repository's Pages setting
# (Settings → Pages → Source: GitHub Actions), so the documentation build, which
# is also the crate's broken-link gate, reports on its own without it.
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built site to GitHub Pages
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# What the Pages deployment flow requires: an OIDC token to claim the
# deployment, and one in-flight run per site. A run in progress is not
# cancelled, so a deployment already under way finishes; a newer run waits for
# it and replaces any older one still waiting.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  module:
    uses: ./.github/workflows/wasm.yml

  build:
    needs: module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The documentation is the artifact here, so warnings are denied: a
      # broken intra-doc link fails the job rather than shipping.
      - name: Build documentation
        env:
          DOCS_RS: 1
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - uses: actions/download-artifact@v4
        with:
          name: vitri-wasm
          path: module

      # The module build uploads the whole page, so a page that grows a file
      # needs no change here. A name the rustdoc already uses fails the job
      # rather than overwriting it. The stylesheet, logo and app references and the
      # imports between the page's scripts take this commit as their stamp (see
      # bindings/wasm/README.md).
      - name: Assemble the site
        run: |
          set -eu
          site=target/site
          cp -r target/doc "$site"
          for file in module/*; do
            name=$(basename "$file")
            if [ -e "$site/$name" ]; then
              echo "$name is already part of the documentation" >&2
              exit 1
            fi
            cp -rL "$file" "$site/"
          done
          sed -i \
            -e "s|href=\"styles.css\"|href=\"styles.css?v=$GITHUB_SHA\"|" \
            -e "s|src=\"app.js\"|src=\"app.js?v=$GITHUB_SHA\"|" \
            -e "s|src=\"logo.svg\"|src=\"logo.svg?v=$GITHUB_SHA\"|" \
            "$site/index.html"
          test "$(grep -c "?v=$GITHUB_SHA\"" "$site/index.html")" -eq 3
          sed -i -e "s|from \"\./\([a-z-]*\.js\)\"|from \"./\1?v=$GITHUB_SHA\"|" "$site"/*.js
          if grep -l 'from "\./[a-z-]*\.js"' "$site"/*.js; then
            echo "an import above is not stamped" >&2
            exit 1
          fi
          grep -q "from \"\./vtree.js?v=$GITHUB_SHA\"" "$site/app.js"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
