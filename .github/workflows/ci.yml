name: CI

# On each pull request to main, nightly, and on manual dispatch. The nightly
# run re-checks the default branch against whatever the runner image and the
# toolchain have become since the last one; the manual trigger runs a branch
# that has no pull request.
on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# A new push to a pull request cancels the run on its previous head. Scheduled
# and manual runs each have a group of their own, so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every manifest and lockfile names one version; the release workflow
      # makes the same check against the tag.
      - name: Check versions
        run: |
          python3 .github/scripts/test_check_versions.py
          python3 .github/scripts/check-versions.py

      # The vendored Arjun stack is built from source by the build script, which
      # needs the packages docs/building.md publishes.
      - uses: ./.github/actions/install-prereqs

      # `--locked` builds against the committed `Cargo.lock` and fails rather
      # than resolving something else, so CI tests the dependency versions the
      # repository names. This job runs whatever toolchain the runner image
      # ships, which is always newer than the declared `rust-version`; the
      # `msrv` job below is what checks that minimum.
      - name: Build
        run: cargo build --release --locked

      # Placed after the build so a crate that does not compile is reported as
      # a compile error rather than as a wall of lint failures, and given the
      # same profile and lockfile as the steps either side of it. `--all-targets`
      # carries the lint past the library to the binary, the tests and the build
      # script; `-D warnings` is what makes a new finding fail the job instead of
      # scrolling past in the log.
      - name: Lint
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --all-targets --locked

      # Run slow and wall-clock guards serially, apart from correctness tests.
      - name: Test the slow guard
        run: cargo test --release --all-targets --locked -- --ignored --test-threads=1

      - name: Test documentation examples
        run: cargo test --release --doc --locked

      - name: Check documentation
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked

      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path examples/rsdd-count/Cargo.toml --check

      - name: Check RSDD example
        run: cargo clippy --release --locked --manifest-path examples/rsdd-count/Cargo.toml -- -D warnings

      # The tutorial's Python routes import vitri's Python package, built from
      # this checkout, and the compilers the tutorial installs from PyPI. Those
      # are not pinned, so the check is of what a reader following the tutorial
      # installs.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install the tutorial's Python packages
        run: |
          python -m venv "$RUNNER_TEMP/tutorial"
          "$RUNNER_TEMP/tutorial/bin/python" -m pip install --disable-pip-version-check \
            ./bindings/python tididi tididi-cnf

      - name: Test the documentation checker
        run: python3 .github/scripts/check_docs.py --self-test

      # Runs each command the README and docs/*.md show with its output and
      # compares the two; the script's docstring says what runs and how. The
      # tutorial's RSDD route builds examples/rsdd-count in release mode.
      - name: Check documented output
        timeout-minutes: 15
        run: PATH="$RUNNER_TEMP/tutorial/bin:$PATH" python3 .github/scripts/check_docs.py

      # `package` builds the crate as a consumer receives it: from the `include`
      # allowlist alone, unpacked into a fresh directory. Both the allowlist and
      # the CMake-cache workaround in the build script exist for that path and
      # for no other, so this is the only step either one is exercised by — and
      # the only one that would notice a new source directory falling outside
      # the list.
      - name: Package
        run: cargo package --locked

      # The unpacked package, not the checkout: this is the only step that
      # would notice a test file shipping without the fixtures it reads.
      - name: Test the packaged crate
        run: |
          cd target/package/vitri-*/
          cargo test --release --locked --all-targets

  # The `rust-version` in Cargo.toml is a promise to anyone building against an
  # older toolchain, and nothing above tests it — the job there compiles with
  # whatever the runner ships. This one pins the declared minimum and compiles
  # the crate with it, so raising the real minimum fails here instead of in a
  # downstream build.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same vendored C/C++ stack as the job above, built by the same build
      # script.
      - uses: ./.github/actions/install-prereqs

      # Read from the manifest rather than repeated here: a hardcoded copy that
      # falls behind `rust-version` leaves this job installing the OLD floor and
      # passing, which is the outcome it exists to prevent.
      - name: Read the declared minimum from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Install the declared minimum toolchain
        run: rustup toolchain install ${{ env.MSRV }} --profile minimal --no-self-update

      # `check`, not `build`: this job is about whether the compiler accepts the
      # crate, and codegen is already covered above. `--locked` keeps a
      # dependency that needs something newer from being resolved away.
      - name: Check
        run: cargo +${{ env.MSRV }} check --locked
