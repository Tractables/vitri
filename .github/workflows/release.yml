name: Release

# Builds GMP from its upstream source tarball, and the command-line tool and the
# C library against it, packages each with those shared libraries and checks
# the archives on clean systems. For a published release, it then attaches the
# archives and the GMP tarball to that release. The manual trigger with a tag
# rebuilds and re-attaches for that tag; without one it builds the selected
# branch. The nightly run and a pull request that changes this workflow or its
# scripts build and check the archives. Without a tag, the files stay a
# workflow artifact.
#
# Linux x86_64 only: the build script merges the vendored C++ archives with GNU
# `ar -M` and links libstdc++, and the vendored stack has not been built on
# macOS or Windows.

on:
  schedule:
    - cron: "30 10 * * *"
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach archives to (empty builds the selected branch without attaching)
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.event.release.tag_name || '' }}
  TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Check that the manifests, changelog and tag name one version
        run: python3 .github/scripts/check-versions.py ${TAG:+"$TAG"}

  linux:
    needs: versions
    # The oldest supported runner image, because the archive requires at least
    # the glibc it was built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/install-prereqs

      - name: Install patchelf
        run: sudo apt-get install -y --no-install-recommends patchelf

      # The archive bundles this GMP rather than the runner's.
      - uses: ./.github/actions/build-gmp

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      # The GMP tarball and its GNU signature go to the release beside the
      # archive built from it.
      - name: Package
        run: |
          label=${TAG:-$(git rev-parse --short=12 HEAD)}
          mkdir -p dist
          cp "$GMP_TARBALL" "$GMP_TARBALL".sig dist/
          .github/scripts/package.sh cli "target/$TARGET/release/vitri" "$label" "$TARGET" "$GMP_PREFIX" dist
          sha256sum dist/*.tar.gz dist/*.tar.gz.sha256 dist/gmp-*.tar.xz dist/gmp-*.tar.xz.sig > dist/manifest.sha256

      - name: Check that the archive carries that GMP, dynamically linked
        run: .github/scripts/check-cli-archive.sh --gmp-prefix "$GMP_PREFIX" dist/vitri-*.tar.gz

      # Stock images, not the runner: the runner has the build tree, a Rust
      # toolchain and the -dev packages, so a missing library would go unnoticed
      # there. ubuntu:22.04 matches the build runner; almalinux:9 is a
      # non-Debian system with an older glibc and C++ runtime.
      - name: Install and run the archive on clean systems
        run: |
          for image in debian:stable-slim ubuntu:22.04 almalinux:9; do
            .github/scripts/check-cli-archive.sh dist/vitri-*.tar.gz "$image"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vitri-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/gmp-*.tar.xz
            dist/gmp-*.tar.xz.sig
            dist/manifest.sha256

  # The C library's shared object, packaged the same way, with the header, the
  # examples and a pkg-config file. Its archive is checked by building the
  # examples against it and running them on the same clean systems.
  c-linux:
    needs: versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/install-prereqs

      - name: Install patchelf
        run: sudo apt-get install -y --no-install-recommends patchelf

      - uses: ./.github/actions/build-gmp

      - name: Build
        working-directory: bindings/c
        run: cargo build --release --locked --lib --target "$TARGET"

      - name: Package
        run: |
          label=${TAG:-$(git rev-parse --short=12 HEAD)}
          mkdir -p dist
          .github/scripts/package.sh c "bindings/c/target/$TARGET/release/libvitri_c.so" "$label" "$TARGET" "$GMP_PREFIX" dist
          sha256sum dist/*.tar.gz dist/*.tar.gz.sha256 > dist/manifest-c.sha256

      - name: Check that the archive carries that GMP, dynamically linked
        run: .github/scripts/check-c-archive.sh --gmp-prefix "$GMP_PREFIX" dist/vitri-c-*.tar.gz

      - name: Build the examples against the archive and run them on clean systems
        run: .github/scripts/check-c-archive.sh dist/vitri-c-*.tar.gz debian:stable-slim ubuntu:22.04 almalinux:9

      - uses: actions/upload-artifact@v4
        with:
          name: vitri-c-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/manifest-c.sha256

  verify-artifact:
    needs: [linux, c-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vitri-*${{ env.TARGET }}
          merge-multiple: true
          path: dist
      - name: Verify every packaged file survived the artifact transfer
        run: sha256sum --check dist/manifest.sha256 dist/manifest-c.sha256

  # The only job that can write to the repository, and it never runs for a pull
  # request.
  attach:
    needs: verify-artifact
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vitri-*${{ env.TARGET }}
          merge-multiple: true
          path: dist

      # `--clobber` so re-running a job replaces its assets instead of failing
      # on the leftovers of the previous attempt.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$TAG"
          dist/vitri-"$TAG"-"$TARGET".tar.gz dist/vitri-"$TAG"-"$TARGET".tar.gz.sha256
          dist/vitri-c-"$TAG"-"$TARGET".tar.gz dist/vitri-c-"$TAG"-"$TARGET".tar.gz.sha256
          dist/gmp-*.tar.xz dist/gmp-*.tar.xz.sig
          --repo "$GITHUB_REPOSITORY" --clobber
