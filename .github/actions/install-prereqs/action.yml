name: Install build prerequisites
description: >
  Install the Debian packages build.rs needs to compile the vendored C++ stack,
  taken from the `sudo apt install` line docs/building.md publishes. That line
  is the one build.rs checks the doc against, so what CI installs and what a
  reader is told to install cannot drift apart.

runs:
  using: composite
  steps:
    - name: Install the packages docs/building.md publishes
      shell: bash
      run: |
        line=$(grep -m1 '^sudo apt install ' docs/building.md)
        test -n "$line" || {
          echo "docs/building.md publishes no Debian install line"
          exit 1
        }
        packages=${line#sudo apt install }
        packages=${packages%%#*}
        echo "installing: $packages"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends $packages
