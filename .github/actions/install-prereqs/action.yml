name: Install build prerequisites
description: >
  Install the Debian packages build.rs needs to compile the vendored C++ stack,
  taken from the `sudo apt install` line docs/building.md publishes. That line
  is the one build.rs checks the doc against, so what CI installs and what a
  reader is told to install cannot drift apart. The `g++-N` package of that
  line is also published as `VITRI_CXX` for the rest of the job, so no workflow
  names a compiler version of its own.

runs:
  using: composite
  steps:
    - name: Install the packages docs/building.md publishes
      shell: bash
      run: |
        line=$(grep -m1 '^sudo apt install ' docs/building.md)
        test -n "$line" || {
          echo "docs/building.md publishes no Debian install line"
          exit 1
        }
        packages=${line#sudo apt install }
        packages=${packages%%#*}
        echo "installing: $packages"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends $packages

        cxx=$(printf '%s\n' $packages | grep -m1 '^g++-[0-9]')
        test -n "$cxx" || {
          echo "the install line names no g++-N package"
          exit 1
        }
        echo "VITRI_CXX=$cxx" >> "$GITHUB_ENV"
